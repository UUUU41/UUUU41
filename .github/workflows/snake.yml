name: Generate Animations (Snake + Pac-Man)
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        id: snake
        with:
          github_user_name: UUUU41
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
      - uses: abozanona/pacman-contribution-graph@main
        id: pacman
        with:
          github_user_name: UUUU41
      - name: Merge outputs into dist
        run: |
          mkdir -p dist
          PD="${{ steps.pacman.outputs.dist }}"
          echo "pacman dist: $PD"
          if [ -n "$PD" ] && [ "$PD" != "dist" ] && [ -d "$PD" ]; then cp -r "$PD/." dist/ || true; fi
          ls -la dist || true
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
